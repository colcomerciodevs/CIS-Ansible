---
## Crear Grupo para restringir el acceso SSH
- name: Crear grupo ssh_access
  ansible.builtin.group:
    name: ssh_access
    state: present


# ------------------------------------------------------------
# ONPREMISE/CLOUD → usuario tux, azureuser, adminso
# ------------------------------------------------------------

- name: Verificar si existen los usuarios
  ansible.builtin.command: "id {{ item }}"
  loop:
    - tux
    - azureuser
    - adminso
  register: usuarios_id
  failed_when: false
  changed_when: false

- name: Agregar usuarios existentes a ssh_access
  ansible.builtin.user:
    name: "{{ item.item }}"
    groups: ssh_access
    append: true
  loop: "{{ usuarios_id.results }}"
  when: item.rc == 0


